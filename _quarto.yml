project:
  type: default

format:
  html:
    toc: true
    number-sections: true
    theme: cosmo
    css:
      - styles/mobile.css
    html-math-method: mathjax

  pdf:
    pdf-engine: lualatex
    toc: true
    number-sections: true
    keep-tex: false
    mainfont: "Times New Roman"
    CJKmainfont: "Noto Serif CJK JP"
