name: Build Quarto PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install build dependencies
        run: bash scripts/setup-runner.sh

      - name: Build PDF (make)
        run: |
          set -eux
          make pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output
          path: public/pdf/**/*.pdf
          if-no-files-found: error