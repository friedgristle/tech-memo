name: Build Quarto PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install pandoc, LaTeX and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-luatex \
            texlive-lang-japanese \
            fonts-noto-cjk

      - name: Render Quarto project
        run: 
          quarto render

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output
          path: *.pdf
          if-no-files-found: error