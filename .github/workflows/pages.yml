name: Deploy Quarto to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Install LaTeX (for PDF)
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-luatex texlive-lang-japanese texlive-latex-extra

    - name: Install fonts
      run: |
        sudo apt-get install -y fonts-texgyre fonts-noto-cjk
        fc-cache -f -v

    - name: Build documents
      run: |
        make all

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to Pages
      uses: actions/deploy-pages@v4